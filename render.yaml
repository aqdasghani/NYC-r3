services:
  # Backend API (FastAPI)
  - type: web
    name: greenshop-ai-backend
    env: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: CORS_ORIGINS
        value: "*"
      - key: JWT_SECRET
        generateValue: true

  # Frontend Web App (Next.js)
  - type: web
    name: greenshop-ai-frontend
    env: node
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: greenshop-ai-backend
          property: url
